name: PWA közzététele (GitHub Pages)

# A main ágra kerülő változások után a PWA automatikusan frissül a GitHub Pages címen.
# Egyszeri beállítás: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
on:
  push:
    branches: [main, claude/new-session-0n19hi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.pages }}
    steps:
      # Amíg a Pages nincs „GitHub Actions” forrásra állítva, a közzététel kimarad (nem piros), csak jelzés készül.
      - id: pages
        name: GitHub Pages beállítás ellenőrzése
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tipus=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | jq -r '.build_type // empty' || true)
          if [ "$tipus" = "workflow" ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A GitHub Pages nincs bekapcsolva (Settings → Pages → Source: GitHub Actions); a közzététel kimarad."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tesztek (közzététel csak zöld számítási maggal)
        run: npm test
      - name: PWA építése
        run: node apps/web/build.mjs
      - if: steps.pages.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
