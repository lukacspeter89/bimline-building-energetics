name: PWA közzététele (GitHub Pages)

# A main ágra kerülő változások után a PWA automatikusan frissül a GitHub Pages címen.
# Egyszeri beállítás: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
on:
  push:
    branches: [main, claude/new-session-0n19hi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tesztek (közzététel csak zöld számítási maggal)
        run: npm test
      - name: PWA építése
        run: node apps/web/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
