name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Típusellenőrzés
        run: npm run typecheck
      - name: Tesztek
        run: npm test
      - name: Követelménymátrix-lefedettség
        run: npm run matrix
